<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Click stats for every short link." />
    <title>Stats — URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Shorten home">Shorten<span>.</span></a>
        <nav class="nav">
          <a class="nav-button" href="/">Create a link</a>
        </nav>
      </header>

      <main>
        <h1>Stats<span>.</span></h1>
        <p class="blurb">Every short link and how many times it has been clicked.</p>

        <div class="stat-summary">
          <div class="stat-card"><strong id="stat-links">0</strong><span>links</span></div>
          <div class="stat-card"><strong id="stat-clicks">0</strong><span>total clicks</span></div>
          <div class="stat-card"><strong id="stat-week">0</strong><span>clicks this week</span></div>
        </div>

        <table class="stats-table">
          <thead>
            <tr>
              <th>Short link</th>
              <th>Destination</th>
              <th>Total</th>
              <th>Opens per day</th>
              <th>Delete</th>
            </tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
        <p class="tz-note">Dates are Lahore time — Pakistan Standard Time (UTC+5).</p>
      </main>

      <footer>
        <p>Built by Karim Shaikh</p>
      </footer>
    </div>
    <script src="js/owner-key.js"></script>
    <script src="js/stats.js"></script>
  </body>
</html>
