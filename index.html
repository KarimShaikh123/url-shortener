<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shorten a link and track every click." />
    <title>Shorten — URL Shortener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Shorten home">Shorten<span>.</span></a>
        <nav class="nav">
          <a href="/stats">Stats</a>
        </nav>
      </header>

      <main>
        <h1>Shorten a link<span>.</span></h1>
        <p class="blurb">Paste a URL, get a short link, and watch its clicks.</p>

        <section class="panel">
          <form id="create-form" class="create-form">
            <label for="input-url">URL to shorten</label>
            <div class="form-row">
              <input id="input-url" type="url" placeholder="https://example.com" autocomplete="off" spellcheck="false" required />
              <button type="submit">Shorten</button>
            </div>
            <p class="field-error" id="form-error" role="alert" hidden></p>
          </form>
          <p class="result" id="result" hidden>
            Your short link: <a id="short-url" href="#" target="_blank" rel="noopener"></a>
          </p>
        </section>
      </main>

      <footer>
        <p>Built by Karim Shaikh</p>
      </footer>
    </div>
    <script src="js/create.js"></script>
  </body>
</html>
